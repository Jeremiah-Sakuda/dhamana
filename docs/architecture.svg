<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .ink{fill:#1b1714} .ink2{fill:#4c453b} .ink3{fill:#8c8273}
      .sans{font-family:Inter, system-ui, sans-serif}
      .mono{font-family:ui-monospace, Menlo, monospace}
      .lbl{font-size:11px; letter-spacing:.14em; text-transform:uppercase}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4c453b"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#f5f1e8"/>
  <text x="40" y="48" class="ink" font-size="30" font-weight="600">Dhamana — architecture</text>
  <text x="40" y="72" class="ink3 sans" font-size="13">fair allocation of scarce things, enforced as database invariants on Amazon Aurora DSQL</text>

  <!-- Clients -->
  <g>
    <rect x="40" y="100" width="240" height="200" rx="6" fill="#fcfaf5" stroke="#ddd3c0"/>
    <text x="60" y="128" class="ink3 sans lbl">Clients</text>
    <rect x="60" y="142" width="200" height="40" rx="4" fill="#efe8da" stroke="#ddd3c0"/>
    <text x="74" y="167" class="ink sans" font-size="13">Fans (buyers)</text>
    <rect x="60" y="192" width="200" height="40" rx="4" fill="#efe8da" stroke="#ddd3c0"/>
    <text x="74" y="217" class="ink sans" font-size="13">Promoters</text>
    <rect x="60" y="242" width="200" height="40" rx="4" fill="#efe8da" stroke="#ddd3c0"/>
    <text x="74" y="267" class="ink sans" font-size="13">Reviewer / admin</text>
  </g>

  <!-- Vercel -->
  <g>
    <rect x="340" y="100" width="280" height="340" rx="6" fill="#fcfaf5" stroke="#ddd3c0"/>
    <text x="360" y="128" class="ink3 sans lbl">Vercel · Next.js App Router</text>
    <rect x="360" y="142" width="240" height="46" rx="4" fill="#efe8da" stroke="#ddd3c0"/>
    <text x="374" y="162" class="ink sans" font-size="12.5" font-weight="600">Pages</text>
    <text x="374" y="179" class="ink2 sans" font-size="11">events · seatmap · my tickets · reviewer · the drop</text>
    <rect x="360" y="198" width="240" height="46" rx="4" fill="#efe8da" stroke="#ddd3c0"/>
    <text x="374" y="218" class="ink sans" font-size="12.5" font-weight="600">Route handlers</text>
    <text x="374" y="235" class="mono ink2" font-size="10.5">/api/buy · /resale · /verify · /race · /load</text>
    <rect x="360" y="254" width="240" height="62" rx="4" fill="#f0e6cf" stroke="#a4761d"/>
    <text x="374" y="275" class="ink sans" font-size="12.5" font-weight="600">transactions.ts — T1·T2·T3·T4</text>
    <text x="374" y="292" class="ink2 sans" font-size="11">retryOnConflict (40001) · idempotent</text>
    <text x="374" y="307" class="ink3 sans" font-size="10">one codebase: memory · postgres · dsql</text>
    <rect x="360" y="326" width="240" height="98" rx="4" fill="#fcfaf5" stroke="#ddd3c0"/>
    <text x="374" y="347" class="ink2 sans" font-size="11" font-weight="600">Invariants enforced at commit</text>
    <text x="374" y="365" class="ink2 sans" font-size="10.5">• no oversell (sharded seat buckets)</text>
    <text x="374" y="381" class="ink2 sans" font-size="10.5">• no double-sale (ticket = capability row)</text>
    <text x="374" y="397" class="ink2 sans" font-size="10.5">• verified-fan gate + per-event cap</text>
    <text x="374" y="413" class="ink2 sans" font-size="10.5">• escrow reconciles · resale price cap</text>
  </g>

  <!-- DSQL -->
  <g>
    <rect x="680" y="100" width="260" height="450" rx="6" fill="#fcfaf5" stroke="#ddd3c0"/>
    <text x="700" y="128" class="ink3 sans lbl">Amazon Aurora DSQL</text>
    <text x="700" y="146" class="ink3 sans" font-size="11">one logical database · active-active</text>

    <rect x="700" y="160" width="220" height="74" rx="4" fill="#f0e6cf" stroke="#a4761d"/>
    <circle cx="716" cy="182" r="5" fill="#a4761d"/>
    <text x="730" y="186" class="ink sans" font-size="13" font-weight="600">Endpoint A</text>
    <text x="700" y="208" class="mono ink2" font-size="11">us-east-1 · read + write</text>
    <text x="700" y="225" class="ink3 sans" font-size="10.5">fans, worldwide on-sale</text>

    <rect x="700" y="248" width="220" height="74" rx="4" fill="#d6e6e2" stroke="#1f5a53"/>
    <circle cx="716" cy="270" r="5" fill="#1f5a53"/>
    <text x="730" y="274" class="ink sans" font-size="13" font-weight="600">Endpoint B</text>
    <text x="700" y="296" class="mono ink2" font-size="11">us-west-2 · read + write</text>
    <text x="700" y="313" class="ink3 sans" font-size="10.5">strong consistency, commit quorum</text>

    <rect x="700" y="336" width="220" height="58" rx="4" fill="#efe8da" stroke="#ddd3c0" stroke-dasharray="4 3"/>
    <text x="700" y="358" class="ink2 sans" font-size="12.5" font-weight="600">Witness · US region</text>
    <text x="700" y="376" class="ink3 sans" font-size="10.5">log-only · commit quorum</text>

    <rect x="700" y="408" width="220" height="124" rx="4" fill="#fcfaf5" stroke="#ddd3c0"/>
    <text x="712" y="429" class="ink2 sans" font-size="11" font-weight="600">OCC · snapshot isolation</text>
    <text x="712" y="447" class="ink2 sans" font-size="10.5">conflicts rejected at COMMIT</text>
    <text x="712" y="463" class="mono ink2" font-size="10.5">SQLSTATE 40001 (OC000)</text>
    <text x="712" y="481" class="ink3 sans" font-size="10">section_stock_buckets (sharded)</text>
    <text x="712" y="497" class="ink3 sans" font-size="10">tickets · escrow ledger · UUIDv7</text>
    <text x="712" y="513" class="ink3 sans" font-size="10">no FK / SERIAL / CHECK</text>
  </g>

  <!-- arrows -->
  <line x1="280" y1="200" x2="338" y2="200" stroke="#4c453b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="283" x2="698" y2="197" stroke="#a4761d" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="620" y1="300" x2="698" y2="285" stroke="#1f5a53" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M812,234 C860,241 860,241 812,248" fill="none" stroke="#8c8273" stroke-width="1.3" stroke-dasharray="3 3"/>

  <text x="40" y="470" class="ink2 sans" font-size="12" font-weight="600">The guarantee</text>
  <text x="40" y="492" class="ink2 sans" font-size="12">Under a flash-drop stampede, you cannot</text>
  <text x="40" y="510" class="ink2 sans" font-size="12">oversell a seat, resell a ticket twice, or</text>
  <text x="40" y="528" class="ink2 sans" font-size="12">buy unverified — enforced at commit.</text>

  <text x="40" y="596" class="ink3 sans" font-size="10.5">Region pairing is same-continent today (us-east-1 + us-west-2, US witness); generalizes as DSQL coverage grows.</text>
</svg>
