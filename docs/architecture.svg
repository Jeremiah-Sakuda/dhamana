<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .ink{fill:#1b1714} .ink2{fill:#4c453b} .ink3{fill:#8c8273}
      .sans{font-family:Inter, system-ui, sans-serif}
      .mono{font-family:ui-monospace, Menlo, monospace}
      .lbl{font-size:11px; letter-spacing:.14em; text-transform:uppercase}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4c453b"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#f5f1e8"/>
  <text x="40" y="48" class="ink" font-size="30" font-weight="600">Dhamana — architecture</text>
  <text x="40" y="72" class="ink3 sans" font-size="13">escrow + verification as database invariants on Amazon Aurora DSQL</text>

  <!-- Client -->
  <g>
    <rect x="40" y="100" width="240" height="200" rx="6" fill="#fcfaf5" stroke="#ddd3c0"/>
    <text x="60" y="128" class="ink3 sans lbl">Clients</text>
    <rect x="60" y="142" width="200" height="40" rx="4" fill="#efe8da" stroke="#ddd3c0"/>
    <text x="74" y="167" class="ink sans" font-size="13">Buyer · diaspora (US/UK)</text>
    <rect x="60" y="192" width="200" height="40" rx="4" fill="#efe8da" stroke="#ddd3c0"/>
    <text x="74" y="217" class="ink sans" font-size="13">Seller · origin (KE/NG/GH)</text>
    <rect x="60" y="242" width="200" height="40" rx="4" fill="#efe8da" stroke="#ddd3c0"/>
    <text x="74" y="267" class="ink sans" font-size="13">Reviewer / admin</text>
  </g>

  <!-- Vercel -->
  <g>
    <rect x="340" y="100" width="280" height="320" rx="6" fill="#fcfaf5" stroke="#ddd3c0"/>
    <text x="360" y="128" class="ink3 sans lbl">Vercel · Next.js App Router</text>
    <rect x="360" y="142" width="240" height="46" rx="4" fill="#efe8da" stroke="#ddd3c0"/>
    <text x="374" y="162" class="ink sans" font-size="12.5" font-weight="600">Pages</text>
    <text x="374" y="179" class="ink2 sans" font-size="11">browse · listing · order · seller · reviewer · consistency</text>
    <rect x="360" y="198" width="240" height="46" rx="4" fill="#efe8da" stroke="#ddd3c0"/>
    <text x="374" y="218" class="ink sans" font-size="12.5" font-weight="600">Route handlers</text>
    <text x="374" y="235" class="mono ink2" font-size="10.5">/api/orders · /release · /verify · /race</text>
    <rect x="360" y="254" width="240" height="58" rx="4" fill="#f0e6cf" stroke="#a4761d"/>
    <text x="374" y="275" class="ink sans" font-size="12.5" font-weight="600">transactions.ts — T1 / T2 / T3</text>
    <text x="374" y="293" class="ink2 sans" font-size="11">retryOnConflict (40001) · idempotent</text>
    <text x="374" y="307" class="ink3 sans" font-size="10">one codebase: memory · postgres · dsql</text>
    <rect x="360" y="322" width="240" height="80" rx="4" fill="#fcfaf5" stroke="#ddd3c0"/>
    <text x="374" y="343" class="ink2 sans" font-size="11" font-weight="600">Invariants enforced at commit</text>
    <text x="374" y="361" class="ink2 sans" font-size="10.5">• no oversell (inventory ≥ 0)</text>
    <text x="374" y="377" class="ink2 sans" font-size="10.5">• no double-release (idempotent escrow)</text>
    <text x="374" y="393" class="ink2 sans" font-size="10.5">• no capability without a verification row</text>
  </g>

  <!-- DSQL -->
  <g>
    <rect x="680" y="100" width="260" height="430" rx="6" fill="#fcfaf5" stroke="#ddd3c0"/>
    <text x="700" y="128" class="ink3 sans lbl">Amazon Aurora DSQL</text>
    <text x="700" y="146" class="ink3 sans" font-size="11">one logical database · active-active</text>

    <rect x="700" y="160" width="220" height="78" rx="4" fill="#f0e6cf" stroke="#a4761d"/>
    <circle cx="716" cy="182" r="5" fill="#a4761d"/>
    <text x="730" y="186" class="ink sans" font-size="13" font-weight="600">Endpoint A</text>
    <text x="700" y="210" class="mono ink2" font-size="11">us-east-1 · read + write</text>
    <text x="700" y="227" class="ink3 sans" font-size="10.5">serves buyer geography</text>

    <rect x="700" y="252" width="220" height="78" rx="4" fill="#d6e6e2" stroke="#1f5a53"/>
    <circle cx="716" cy="274" r="5" fill="#1f5a53"/>
    <text x="730" y="278" class="ink sans" font-size="13" font-weight="600">Endpoint B</text>
    <text x="700" y="302" class="mono ink2" font-size="11">us-east-2 · read + write</text>
    <text x="700" y="319" class="ink3 sans" font-size="10.5">serves seller geography</text>

    <rect x="700" y="344" width="220" height="64" rx="4" fill="#efe8da" stroke="#ddd3c0" stroke-dasharray="4 3"/>
    <text x="700" y="367" class="ink2 sans" font-size="12.5" font-weight="600">Witness · us-west-2</text>
    <text x="700" y="385" class="ink3 sans" font-size="10.5">log-only · no endpoint</text>
    <text x="700" y="399" class="ink3 sans" font-size="10.5">commit quorum + durability</text>

    <rect x="700" y="422" width="220" height="92" rx="4" fill="#fcfaf5" stroke="#ddd3c0"/>
    <text x="712" y="443" class="ink2 sans" font-size="11" font-weight="600">OCC · snapshot isolation</text>
    <text x="712" y="461" class="ink2 sans" font-size="10.5">conflicts rejected at COMMIT</text>
    <text x="712" y="477" class="mono ink2" font-size="10.5">SQLSTATE 40001 (OC000)</text>
    <text x="712" y="495" class="ink3 sans" font-size="10">UUIDv7 keys · no FK/SERIAL/CHECK</text>
  </g>

  <!-- arrows -->
  <line x1="280" y1="200" x2="338" y2="200" stroke="#4c453b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="283" x2="698" y2="199" stroke="#a4761d" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="620" y1="300" x2="698" y2="291" stroke="#1f5a53" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- sync replication between A and B -->
  <path d="M812,238 C860,245 860,245 812,252" fill="none" stroke="#8c8273" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="700" y="246" class="ink3 sans" font-size="9.5" transform="rotate(0)"></text>

  <text x="40" y="470" class="ink2 sans" font-size="12" font-weight="600">The guarantee</text>
  <text x="40" y="492" class="ink2 sans" font-size="12" width="260">Across two regions, money cannot move</text>
  <text x="40" y="510" class="ink2 sans" font-size="12">without a verification row, and the books</text>
  <text x="40" y="528" class="ink2 sans" font-size="12">cannot diverge — enforced at commit.</text>

  <text x="40" y="596" class="ink3 sans" font-size="10.5">Region pairing is same-continent today (us-east-1 + us-east-2, witness us-west-2); generalizes to af-south-1 as DSQL coverage grows.</text>
</svg>
